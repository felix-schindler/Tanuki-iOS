			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = "/bin/sh -e";
			shellScript = "# Skip builds this project with `-sdk iphonesimulator` for its Android step,
# which overrides SDKROOT and forces this watchOS target onto the iOS
# Simulator SDK - and Xcode then skips signing the product it builds, in that
# mode and in watchOS-simulator builds alike. Embedding an unsigned watch app
# fails with \"Embedded binary is not signed with the same certificate as the
# parent app\", so sign it ad-hoc here whenever Xcode left it unsigned. Device
# and archive builds are never touched.
case \"${EFFECTIVE_PLATFORM_NAME}\" in
	-iphonesimulator | -watchsimulator)
		if ! codesign --verify \"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\" 2>/dev/null; then
			codesign --force --sign - \"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\" || exit 1
		fi
		;;
esac
\n	echo \"${EFFECTIVE_PLATFORM_NAME}\" > \"${BUILD_DIR}/watch-app-platform\"\n";
		};
		DCCDC0412FAB52600A5A813 /* Embed watch app */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
