			runOnlyForDeploymentPostprocessing = 0;
			shellPath = "/bin/sh -e";
			shellScript = "# Xcode's \"Embed Watch Content\" phase is not used here: it copies whatever the\n# watch target built for the platform this build was forced to use, and\n# `skip app launch` forces `-sdk iphonesimulator` onto every target. The copy\n# it produced was an iOS build of the watch app, which makes installing the app\n# on the phone simulator fail with \"Found WatchKit 2.0 app ... but it does not\n# have a WKWatchKitApp or WKApplication key set to true in its Info.plist\".\n# Embed the watch app only when this build actually produced one for watchOS or\n# watchOS Simulator, and embed nothing otherwise.\ndest=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Watch\"\nrm -rf \"$dest\"\nwatch_platform=$(cat \"${BUILD_DIR}/watch-app-platform\" 2>/dev/null)\ncase \"$watch_platform\" in\n	-watchos | -watchsimulator)\n		src=\"${BUILD_DIR}/${CONFIGURATION}${watch_platform}/Tanuki Watch App.app\"\n		;;\n	*)\n		src=\"\"\n		;;\nesac\nif [ -n \"$src\" ] && [ -d \"$src\" ]; then\n	mkdir -p \"$dest\"\n	cp -R \"$src\" \"$dest/\"\nfi\n";
		};
