query MergeRequests($fullPath: ID!) {
  project(fullPath: $fullPath) {
    mergeRequestsEnabled
    
    userPermissions {
      createMergeRequestIn
    }
    
    mergeRequests(state: opened) {
      nodes {
        iid
        title
        reference(full: true)
        state
        upvotes
        downvotes
        userNotesCount
        author {
          name
        }
        createdAt
        webUrl
      }
    }
  }
}
