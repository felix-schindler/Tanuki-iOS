query Projects($membership: Boolean, $search: String, $personal: Boolean, $sort: String, $withIssuesEnabled: Boolean, $withMergeRequestsEnabled: Boolean, $archived: ProjectArchived, $minAccessLevel: AccessLevelEnum, $aimedForDeletion: Boolean, $notAimedForDeletion: Boolean, $markedForDeletionOn: Date, $active: Boolean) {
  projects(
    membership: $membership
    search: $search
    personal: $personal
    sort: $sort
    withIssuesEnabled: $withIssuesEnabled
    withMergeRequestsEnabled: $withMergeRequestsEnabled
    archived: $archived
    minAccessLevel: $minAccessLevel
    aimedForDeletion: $aimedForDeletion
    notAimedForDeletion: $notAimedForDeletion
    markedForDeletionOn: $markedForDeletionOn
    active: $active
  ) {
    nodes {
      avatarUrl
      nameWithNamespace
      visibility
      fullPath
    }
  }
}
