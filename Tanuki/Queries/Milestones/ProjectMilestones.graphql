query ProjectMilestones($fullPath: ID!) {
  project(fullPath: $fullPath) {
    milestones(state: active, sort: CREATED_DESC) {
      nodes {
        id
        iid
        state
        title
        description

        expired
        startDate
        dueDate

        stats {
          closedIssuesCount
          totalIssuesCount
        }

        webPath
      }
    }
  }
}
