query UserAuthoredMergeRequests {
  currentUser {
    authoredMergeRequests(state: opened) {
      nodes {
        project {
          fullPath
        }
        iid
        title
        reference(full: true)
        state
        upvotes
        downvotes
        userNotesCount
        author {
          avatarUrl
          name
          username
        }
        createdAt
        webUrl
      }
    }
  }
}
