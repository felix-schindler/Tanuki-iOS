query UserReviewRequestedMergeRequests {
  currentUser {
    reviewRequestedMergeRequests(state: opened) {
      count
      nodes {
        project {
          fullPath
        }
        iid
        title
        reference(full: true)
        state
        upvotes
        downvotes
        userNotesCount
        author {
          name
        }
        createdAt
        webUrl
      }
    }
  }
}
