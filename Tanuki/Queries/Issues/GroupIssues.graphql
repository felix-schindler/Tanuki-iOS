query GroupIssues($fullPath: ID!, $state: IssuableState, $search: String, $confidential: Boolean, $subscribed: SubscriptionStatus, $types: [IssueType!]) {
  group(fullPath: $fullPath) {
    issues(
      state: $state
      search: $search
      confidential: $confidential
      subscribed: $subscribed
      types: $types
    ) {
      nodes {
        iid
        title
        reference(full: true)
        state
        upvotes
        downvotes
        userNotesCount
        author {
          avatarUrl
          name
          username
        }
        createdAt
        webUrl
      }
    }
  }
}
