query UserTimelogs($username: String!) {
  user(username: $username) {
    timelogs(sort: SPENT_AT_DESC) {
      nodes {
		id
        user {
          avatarUrl
          name
          username
        }
        spentAt
        summary
        timeSpent
        project {
          fullPath
          nameWithNamespace
        }
        issue {
          iid
        }
        mergeRequest {
          iid
        }
      }
    }
  }
}
