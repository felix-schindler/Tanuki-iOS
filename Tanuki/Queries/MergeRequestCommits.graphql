query MergeRequestCommits($fullPath: ID!, $iid: String!) {
  project(fullPath: $fullPath) {
    id
    mergeRequest(iid: $iid) {
      commits {
        nodes {
          id
          title
          shortId
          authorName
          authoredDate
          webUrl
          signature {
            verificationStatus
          }
          pipelines {
            nodes {
              status
            }
          }
        }
      }
    }
  }
}
